# MACF 配置文件 — 任务管理 API 设计

task:
  name: "任务管理 API 设计"
  scope: fullstack
  description: |
    设计并优化一个任务管理模块的 API。

    功能需求：
    - 任务 CRUD（创建、查询、更新、删除）
    - 任务状态流转（pending → in_progress → completed）
    - 分页查询任务列表

    当前实现存在的问题（见 workspace/target/task_api.py）：
    1. 接口不 RESTful（用 POST /create 而不是 POST /tasks）
    2. 缺少输入验证（标题、状态值）
    3. 删除接口用 GET 而不是 DELETE
    4. 缺少分页和错误处理
    5. 缺少状态流转约束

    请讨论：
    1. RESTful 接口设计（URL、HTTP 方法、状态码）
    2. 输入验证策略
    3. 状态流转规则（pending → in_progress → completed）
    4. 分页查询设计
    5. 前后端分工与接口契约

    注意：只讨论出方案文档，不写代码。

broker:
  host: localhost
  port: 6379

models:
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    model: deepseek-chat

agents:
  - id: agent-a
    name: "前端架构师"
    model: deepseek
    role: "资深前端架构师，擅长 React/Vue、TypeScript、前端工程化。负责前端方案设计（表单验证、接口调用、状态管理），并与后端工程师讨论接口契约。只负责讨论出方案，不修改代码。"
    workspace: ./workspace/agent-a
    tools: [read_file, list_files]

  - id: agent-b
    name: "后端工程师"
    model: deepseek
    role: "资深后端工程师，擅长 Python、数据库设计、RESTful API。负责后端方案设计（接口设计、数据模型、状态机），并与前端工程师讨论接口对接。只负责讨论出方案，不修改代码。"
    workspace: ./workspace/agent-b
    tools: [read_file, list_files]

debate:
  max_turns: 6
  consensus_keywords: ["同意", "方案通过", "可以实施", "达成共识"]
